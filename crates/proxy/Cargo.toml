[package]
name = "cocodex-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "cocodex_proxy"
path = "src/lib.rs"

[[bin]]
name = "cocodex"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "zstd", "json", "cookies", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
# Upstream WebSocket client: the same tungstenite fork Codex uses, so the
# handshake can offer permessage-deflate like the real client does.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.27", default-features = false, features = ["deflate", "handshake"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
os_info = "3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "macros"] }
dotenvy = "0.15.7"
chrono = "0.4.45"
scrypt = { version = "0.12.0", default-features = false }
zstd = "0.14.0"
hex = "0.4.3"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
